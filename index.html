<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에너지 마스터: 열과 반응의 비밀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#E8F0F7; --panel:#FFFFFF; --line:#C6D6E5; --ink:#2A3A55; --sub:#5D708C;
  --hot:#DD4128; --hot2:#FFE3DA; --cold:#1C6FCF; --cold2:#DCEAFF;
  --gold:#C97F06; --gold2:#FFF0CF; --mint:#13845C; --mint2:#DBF4E8;
  --violet:#6547D2; --violet2:#ECE6FF; --monitor:#15223B; --monitor2:#1E2E4E;
  --font:'a시네마L','a시네마M','a시네마','aCinemaL','Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;font-weight:400}
body{margin:0;background-color:var(--bg);
  background-image:linear-gradient(rgba(28,111,207,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(28,111,207,.05) 1px,transparent 1px);
  background-size:28px 28px;color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,b,strong,th{font-weight:400}
button,input,textarea{font-family:var(--font);font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.hot{color:var(--hot)} .cold{color:var(--cold)} .key{color:var(--violet)} .ok{color:var(--mint)} .warn{color:var(--gold)} .sub{color:var(--sub)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0 10px}
.title h1{margin:0;font-size:38px;line-height:1.1;letter-spacing:-.5px}
.title p{margin:4px 0 0;color:var(--sub);font-size:19px}
.brand{display:flex;align-items:center;gap:10px;text-align:right}
.brand img{width:58px;height:58px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.brand span{font-size:15px;color:var(--sub);line-height:1.3}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px 14px;font-size:17px;color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.locked{color:#9AAABE;background:#F3F6FA}
.tab.clear{border-color:var(--mint)}
.dex-btn{border:2px solid var(--gold);background:var(--gold2);color:#7a4c00;border-radius:14px;padding:7px 14px;font-size:17px}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px 20px}
.btn{border:none;background:var(--violet);color:#fff;border-radius:14px;padding:10px 20px;font-size:19px;box-shadow:0 4px 0 #4630A4;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4630A4}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #0B5E40}
.btn.gold{background:#E39A16;box-shadow:0 4px 0 #A86C00}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{font-size:16px;padding:6px 12px}
.btn:disabled{opacity:.45;pointer-events:none}
.msg{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:17px;line-height:1.55}
.msg:empty{display:none}
.msg.good{background:var(--mint2);color:#0E5C40}
.msg.bad{background:var(--hot2);color:#9A2914}
.msg.info{background:var(--cold2);color:#164E8F}
.msg.warnbox{background:var(--gold2);color:#7A4C00}

/* intro */
.intro{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.intro h2{margin:0 0 8px;font-size:26px}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.term{border-radius:14px;padding:10px 12px;font-size:17px}
.term.h{background:var(--hot2)} .term.c{background:var(--cold2)} .term.n{background:var(--violet2);grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:19px;background:#fff}
.stage-list{margin:10px 0 0;padding:0;list-style:none}
.stage-list li{padding:8px 0;border-top:1px dashed var(--line)}

/* stage */
.stage-head{margin-bottom:14px}
.stage-head .sh-title{font-size:26px;margin-bottom:4px}
.stage-head p{margin:0 0 10px;color:var(--sub)}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-size:17px}
.pill.on{border-color:var(--violet);background:var(--violet2);color:var(--violet)}
.pill.done{color:var(--mint)}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.monitor{background:var(--monitor);border-color:#0E1729;color:#DDE7F5}
.mon-head{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:#9FB3CF;margin-bottom:8px}
.rec{color:#FF8A73}
.mon-body{display:grid;grid-template-columns:1fr 64px;gap:10px}
.thermal-wrap{position:relative;border-radius:14px;overflow:hidden;background:#0B1326}
.thermal-wrap canvas{display:block;width:100%;height:270px}
.obj{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.obj .e{font-size:58px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.obj .l{margin-top:4px;font-size:15px;background:rgba(10,18,36,.6);color:#fff;border-radius:999px;padding:2px 10px;white-space:nowrap}
.tread{position:absolute;left:12px;top:8px;font-size:36px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.tlabel{position:absolute;right:10px;top:12px;font-size:14px;color:#cfdaea;background:rgba(10,18,36,.55);border-radius:8px;padding:2px 8px}
.thermo{position:relative;height:270px;border-radius:12px;border:2px solid #2C3E62}
.thermo .bar{position:absolute;left:8px;right:8px;top:6px;bottom:6px;border-radius:8px}
.thermo .band{position:absolute;left:2px;right:2px;border:2px solid #7CF2BE;background:rgba(124,242,190,.22);border-radius:6px}
.thermo .mark{position:absolute;left:-4px;right:-4px;height:4px;background:#fff;border-radius:3px;box-shadow:0 0 6px #fff;transition:bottom .05s}
.thermo .lab{position:absolute;right:2px;font-size:12px;color:#C9D6EA;background:rgba(10,18,36,.7);padding:0 4px;border-radius:4px}
.diag{margin-top:12px;background:var(--monitor2);border-radius:14px;padding:10px 12px;min-height:120px;font-size:16px;color:#AFC1DB}
.diag svg{width:100%;height:auto;display:block}
.steps .story{background:var(--cold2);border-radius:14px;padding:10px 14px;margin-bottom:6px;font-size:18px}
.step{border-top:2px dashed var(--line);padding:14px 0 6px}
.step.locked{opacity:.38;pointer-events:none}
.step-h{display:flex;align-items:center;gap:8px;font-size:21px;margin-bottom:4px}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--violet2);color:var(--violet);align-items:center;justify-content:center;font-size:17px;flex:none}
.step.fin .num{background:var(--mint2);color:var(--mint)}
.step p{margin:4px 0 8px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px}
.item .ie{font-size:40px;line-height:1.1}
.item small{color:var(--sub);font-size:14px}
.item.sel{border-color:var(--mint);background:var(--mint2)}
.item.bad{border-color:var(--hot);background:var(--hot2)}
.slider-row{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.slider-row input{flex:1;accent-color:var(--violet);height:32px}
.slider-row .amt{min-width:78px;text-align:right;color:var(--violet);font-size:21px}
.q{margin:10px 0 6px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-size:18px}
.opt small{color:var(--sub);font-size:14px}
.opt.sel{border-color:var(--violet);background:var(--violet2);color:var(--violet)}
.opt.bad{border-color:var(--hot);background:var(--hot2);color:var(--hot)}
.opt.good{border-color:var(--mint);background:var(--mint2);color:var(--mint)}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:4px 0 8px}
.box{border-radius:14px;padding:8px;text-align:center;font-size:18px;line-height:1.35}
.box small{display:block;font-size:14px;color:var(--sub)}
.box.sys{background:var(--violet2);border:2px solid #BDAEF2}
.box.surr{background:#F1F5F9;border:2px solid var(--line)}
.slot{min-width:118px;height:70px;border:3px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--sub);text-align:center;padding:4px}
.slot.over{border-color:var(--violet);background:var(--violet2)}
.slot .arw{font-size:44px;line-height:1;color:var(--violet)}
.slot.bad{border-color:var(--hot);background:var(--hot2)}
.slot.good{border-style:solid;border-color:var(--mint);background:var(--mint2)}
.slot.good .arw{color:var(--mint)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--violet);color:var(--violet);background:#fff;border-radius:999px;padding:8px 16px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.picked{background:var(--violet2)}
.dragghost{position:fixed;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);z-index:999;opacity:.92;box-shadow:0 8px 20px rgba(20,34,59,.25)}
.hint{font-size:15px;color:var(--sub)}
.done-box{margin-top:12px;border:2px solid var(--mint);background:var(--mint2);border-radius:16px;padding:12px 14px;color:#0E5C40}
.card-get{display:flex;align-items:center;gap:12px;margin-top:8px}
.card-get .ce{font-size:40px}

/* stage 3 */
.s3{display:grid;gap:16px}
.sec-t{font-size:23px;margin-bottom:6px}
.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:58px;padding:8px;border:2px dashed var(--line);border-radius:14px;margin-bottom:10px}
.pcard{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.pcard .pe{font-size:24px}
.pcard.picked{border-color:var(--violet);background:var(--violet2)}
.pcard.bad{border-color:var(--hot);background:var(--hot2)}
.pcard.good{border-color:var(--mint);background:var(--mint2)}
.sortgrid{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px}
.sortgrid .hd{text-align:center;padding:6px;border-radius:10px;font-size:18px}
.sortgrid .hd.h{background:var(--hot2);color:var(--hot)} .sortgrid .hd.c{background:var(--cold2);color:var(--cold)}
.sortgrid .rh{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--violet2);color:var(--violet);border-radius:10px;font-size:17px;padding:6px}
.cell{min-height:86px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.cell.over{border-color:var(--violet);background:var(--violet2)}
.bal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.land{position:relative;height:320px;border-radius:18px;overflow:hidden;border:2px solid #0E1729;transition:background .3s}
.land .le{position:absolute;line-height:1;transition:transform .3s,opacity .3s}
.land .ltemp{position:absolute;left:12px;top:10px;font-size:36px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.land .lstate{position:absolute;right:10px;top:14px;font-size:15px;background:rgba(10,18,36,.55);color:#fff;border-radius:8px;padding:2px 10px}
.land .ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#7BAE5A,#5C8B41)}
.land .lake{position:absolute;right:6%;bottom:6%;width:34%;height:16%;border-radius:50%;background:radial-gradient(#7CC4F5,#2E86D1)}
.sl{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px;margin:6px 0}
.sl .se{font-size:26px}
.sl label{font-size:17px;display:flex;flex-direction:column}
.sl input{accent-color:var(--violet);width:100%;height:30px}
.sl .sv{color:var(--violet);font-size:21px;text-align:right}
.ebar{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:8px;font-size:16px;margin:4px 0}
.ebar .track{height:16px;border-radius:8px;background:#EDF2F7;overflow:hidden}
.ebar .fill{height:100%;border-radius:8px;transition:width .2s}

/* quiz */
.qcard{margin-bottom:14px}
.qn{color:var(--violet);font-size:18px}
.qtext{font-size:20px;margin:4px 0 10px}
.qbox{background:#F4F7FB;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:17px}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;font-size:18px}
.qopt.bad{border-color:var(--hot);background:var(--hot2);color:#9A2914}
.qopt.good{border-color:var(--mint);background:var(--mint2);color:#0E5C40}
.qopt:disabled{opacity:1}
textarea{width:100%;min-height:130px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:18px;line-height:1.6;resize:vertical;background:#fff}
.crit{list-style:none;padding:0;margin:6px 0 0}
.crit li{padding:3px 0}
.sample{margin-top:8px;background:var(--violet2);border-radius:12px;padding:10px 12px;color:#3F2A96;font-size:17px}

/* result */
.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.cert-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
#cert{width:760px;background:#fff;border:3px solid var(--ink);border-radius:24px;padding:28px 30px;color:var(--ink);font-family:var(--font)}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px dashed var(--line);padding-bottom:12px}
.c-head .ct{font-size:32px;line-height:1.15}
.c-head .cs{color:var(--sub);font-size:17px}
.c-brand{display:flex;align-items:center;gap:8px;text-align:right}
.c-brand img{width:62px;height:62px;border-radius:12px;border:2px solid var(--line)}
.c-brand span{font-size:14px;color:var(--sub);line-height:1.3}
.c-top{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center;margin:16px 0}
.grade{width:126px;height:126px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1}
.grade .g{font-size:72px}
.grade .gl{font-size:15px;margin-top:2px}
.sbar{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;margin:5px 0;font-size:17px}
.sbar .track{height:14px;background:#EDF2F7;border-radius:7px;overflow:hidden}
.sbar .fill{height:100%;border-radius:7px}
.c-sec{margin-top:16px}
.c-sec .h{font-size:21px;color:var(--violet);margin-bottom:6px}
.c-table{width:100%;border-collapse:collapse;font-size:16px}
.c-table td,.c-table th{border-bottom:1px solid #E1E8F0;padding:5px 6px;text-align:left}
.c-table th{color:var(--sub)}
.c-ans{background:#F4F7FB;border-radius:12px;padding:10px 12px;font-size:16px;margin-bottom:8px;white-space:pre-wrap;word-break:break-all}
.c-fb p{margin:0 0 8px;font-size:17px;line-height:1.65}
.c-up{background:var(--gold2);border-radius:12px;padding:10px 12px;font-size:16px;color:#6B4300}
.dexrow{font-size:26px;letter-spacing:4px}
.c-foot{margin-top:14px;text-align:right;color:var(--sub);font-size:14px}
.badge{display:inline-block;border:2px solid var(--gold);background:var(--gold2);color:#7A4C00;border-radius:999px;padding:2px 14px;font-size:17px;margin-top:6px}
.up-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.up-item .ul{font-size:17px}
.up-item .btn{flex:none;white-space:nowrap}
.up-item .ug{color:var(--mint);font-size:15px}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(21,34,59,.6);display:flex;align-items:center;justify-content:center;z-index:900;padding:16px}
.modal-box{background:#fff;border-radius:20px;max-width:min(860px,96vw);max-height:92vh;overflow:auto;padding:18px 20px;-webkit-overflow-scrolling:touch}
.modal-box h3{margin:0 0 8px;font-size:24px}
.preview{max-width:100%;border:2px solid var(--line);border-radius:12px;display:block;margin:8px auto;-webkit-touch-callout:default}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.dcard{border:2px solid var(--line);border-radius:16px;padding:10px;background:#fff;min-height:150px}
.dcard.lock{background:#F2F5F9;color:#9AAABE;display:flex;align-items:center;justify-content:center;font-size:40px}
.dcard .de{font-size:38px}
.dcard .dn{font-size:19px}
.dcard .dt{font-size:14px;margin:2px 0 4px}
.dcard .dd{font-size:14px;color:var(--sub);line-height:1.45}
.tag{display:inline-block;border-radius:999px;padding:0 8px;font-size:13px;margin-right:4px}
.tag.h{background:var(--hot2);color:var(--hot)} .tag.c{background:var(--cold2);color:var(--cold)} .tag.p{background:#EEF2F6;color:var(--sub)} .tag.k{background:var(--violet2);color:var(--violet)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;font-size:17px;z-index:1000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}

@media (max-width:900px){
  .case-grid,.intro,.bal,.res{grid-template-columns:1fr}
  .title h1{font-size:30px}
}
@media (max-width:560px){
  .brand span{display:none}
  .items{grid-template-columns:1fr 1fr}
  .sortgrid{grid-template-columns:76px 1fr 1fr}
  .flow{grid-template-columns:1fr;text-align:center}
  .slot{margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>에너지 마스터</h1>
      <p>열과 반응의 비밀: 에너지 흡수와 방출</p>
    </div>

/* ================= 열화상 카메라 ================= */
const TH={canvas:null,ctx:null,temp:20,range:[0,40],env:20,flux:0,parts:[],fl:[],w:0,h:0};
function initThermal(c,st){
  const cv=$('#thermal');TH.canvas=cv;TH.ctx=cv.getContext('2d');TH.range=c.range;TH.env=c.env;TH.flux=0;TH.fl=[];
  TH.parts=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),a:Math.random()*6.28,s:.5+Math.random()}));
  sizeThermal();setTemp(st.temp);
}
function sizeThermal(){if(!TH.canvas)return;const r=TH.canvas.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);TH.w=r.width;TH.h=r.height;TH.canvas.width=Math.max(1,r.width*d);TH.canvas.height=Math.max(1,r.height*d);TH.ctx.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',sizeThermal);
function norm(t){return (t-TH.range[0])/(TH.range[1]-TH.range[0]);}
function setTemp(t){
  TH.temp=t;const rd=$('#tread');if(!rd)return;
  rd.textContent=(Math.abs(t)>=100?Math.round(t):t.toFixed(1))+'°C';
  const mk=$('#tmark');if(mk)mk.style.bottom=`calc(${Math.max(0,Math.min(1,norm(t)))*100}% - 2px)`;
}
function thermalLoop(){
  requestAnimationFrame(thermalLoop);
  const cv=TH.canvas;if(!cv||!cv.isConnected)return;
  const g=TH.ctx,w=TH.w,h=TH.h;if(!w)return;
  const n=Math.max(0,Math.min(1,norm(TH.temp))),en=Math.max(0,Math.min(1,norm(TH.env)));
  const cc=heatColor(n),ec=heatColor(en*.55+n*.45),oc=heatColor(en);
  const R=Math.max(w,h)*.7;const gr=g.createRadialGradient(w/2,h/2,10,w/2,h/2,R);
  gr.addColorStop(0,rgb(cc));gr.addColorStop(.35,rgb(cc,.95));gr.addColorStop(.7,rgb(ec));gr.addColorStop(1,rgb(oc));
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  const sp=.25+n*2.4;
  g.fillStyle='rgba(255,255,255,.55)';
  for(const p of TH.parts){p.a+=.15*p.s;p.x+=(Math.cos(p.a)*sp*p.s)/w*1.6;p.y+=(Math.sin(p.a*1.3)*sp*p.s)/h*1.6;
    p.x+=(Math.random()-.5)*sp*.006;p.y+=(Math.random()-.5)*sp*.006;if(p.x<0)p.x+=1;if(p.x>1)p.x-=1;if(p.y<0)p.y+=1;if(p.y>1)p.y-=1;
    g.beginPath();g.arc(p.x*w,p.y*h,2+n*2.2,0,6.283);g.fill();}
  if(TH.flux!==0&&Math.random()<.6){const a=Math.random()*6.283;TH.fl.push({a,r:TH.flux>0?50:Math.max(w,h)*.55,life:1});}
  for(const f of TH.fl){f.r+=TH.flux>=0?3.2:-3.2;f.life-=.012;}
  TH.fl=TH.fl.filter(f=>f.life>0&&f.r>40&&f.r<Math.max(w,h)*.6);
  for(const f of TH.fl){const x=w/2+Math.cos(f.a)*f.r,y=h/2+Math.sin(f.a)*f.r;g.save();g.translate(x,y);g.rotate(f.a+(TH.flux>0?0:Math.PI));
    g.strokeStyle=TH.flux>0?`rgba(255,226,214,${f.life})`:`rgba(210,232,255,${f.life})`;g.lineWidth=3;g.beginPath();g.moveTo(-6,-6);g.lineTo(2,0);g.lineTo(-6,6);g.stroke();g.restore();}
}
requestAnimationFrame(thermalLoop);
function animateTemp(from,to,dur,cb){
  const t0=performance.now();TH.flux=to>=from?1:-1;sfx.sweep(to>=from);
  function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);setTemp(from+(to-from)*e);if(p<1)requestAnimationFrame(step);else{TH.flux=0;cb&&cb();}}
  requestAnimationFrame(step);
}

  const ink=light?'#2A3A55':'#DDE7F5',sub=light?'#5D708C':'#9FB3CF',col=dir==='exo'?'#FF7A5C':'#5AA8FF',colL=dir==='exo'?'#DD4128':'#1C6FCF',c=light?colL:col;
  const lab=dir==='exo'?'에너지 방출':'에너지 흡수';
  return `<svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg" font-family="inherit">
  <line x1="30" y1="170" x2="30" y2="14" stroke="${sub}" stroke-width="2"/><polygon points="30,8 25,18 35,18" fill="${sub}"/>
  <text x="16" y="96" fill="${sub}" font-size="13" text-anchor="middle" transform="rotate(-90 16 96)">에너지</text>
  <line x1="30" y1="170" x2="350" y2="170" stroke="${sub}" stroke-width="2"/>
  <text x="250" y="186" fill="${sub}" font-size="12">반응의 진행 →</text>
  <line x1="50" y1="${ry}" x2="150" y2="${ry}" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="${py}" x2="330" y2="${py}" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="${ry}" x2="220" y2="${py}" stroke="${sub}" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="100" y="${ry-8}" fill="${ink}" font-size="13" text-anchor="middle">${rL}</text>
  <text x="275" y="${py-8}" fill="${ink}" font-size="13" text-anchor="middle">${pL}</text>
  <line x1="190" y1="${ry}" x2="190" y2="${py+(dir==='exo'?-8:8)}" stroke="${c}" stroke-width="4"/>
  <polygon points="${dir==='exo'?`190,${py} 183,${py-12} 197,${py-12}`:`190,${py} 183,${py+12} 197,${py+12}`}" fill="${c}"/>
  <text x="${dir==='exo'?200:200}" y="${(ry+py)/2+5}" fill="${c}" font-size="15">${lab}</text>
  </svg>`;
}

function pickCase(n,id){sfx.click();S.cur[n]=id;save();renderStage(n);}

function stepClass(on,fin){return `step ${on?'':'locked'} ${fin?'fin':''}`;}

    <div class="slider-row"><span class="hint">적게</span><input type="range" min="1" max="10" step="1" value="${st.amount}" aria-label="${c.amountLabel}" oninput="setAmount('${id}',this.value)" ${runFin?'disabled':''}><span class="hint">많이</span><span class="amt" id="amt-${id}">${c.amt(st.amount)}</span></div>
    <button class="btn" id="runBtn" onclick="runReaction('${id}')" ${runFin?'disabled':''}>반응 시작</button>
    <div class="msg ${M.runC||''}">${M.run||''}</div></div>`;n++;
  const jOn=idx>=2,jFin=idx>=3,B=st.bad||{};
  const optC=(f,v)=>{if(st[f]!==v)return'';if(jFin)return'good';if(B[f])return'bad';return'sel';};

  h+=`<div class="${stepClass(jOn,jFin)}"><div class="step-h"><span class="num">${jFin?'✓':n}</span>에너지 출입 판정</div>
    <p class="q">① 온도 변화를 보면, 이 현상에서 계(${c.sys})는 에너지를…</p>
    <div class="choice"><button class="opt ${optC('dir','exo')}" onclick="setJudge('${id}','dir','exo')">방출해요</button><button class="opt ${optC('dir','endo')}" onclick="setJudge('${id}','dir','endo')">흡수해요</button></div>
    <p class="q">② 에너지가 이동하는 방향의 화살표를 끌어다 칸에 놓아요. <span class="hint">(눌러도 놓여요)</span></p>
    <div class="flow"><div class="box sys">계<small>${c.sys}</small></div>
      <div class="slot ${jFin?'good':(B.arrow&&st.arrow?'bad':'')}" data-drop="slot">${arrowHTML}</div>
      <div class="box surr">주변<small>${c.surr}</small></div></div>
    ${jFin?'':`<div class="chips"><div class="chip" data-drag="arrow:out">➜ 계에서 주변으로</div><div class="chip" data-drag="arrow:in">⬅ 주변에서 계로</div></div>`}

    <div class="choice"><button class="opt ${optC('kind','phys')}" onclick="setJudge('${id}','kind','phys')">물리 변화 <small>(상태 변화·용해)</small></button><button class="opt ${optC('kind','chem')}" onclick="setJudge('${id}','kind','chem')">화학 변화 <small>(새로운 물질 생성)</small></button></div>
    <div style="margin-top:12px"><button class="btn" onclick="submitJudge('${id}')" ${jFin?'disabled':''}>판정 제출</button></div>

    h+=`<div class="done-box">사례 해결! ${c.explain}

function nextHint(stage){
  const ids=Object.keys(CASES).filter(k=>CASES[k].stage===stage),left=ids.filter(k=>!S.cases[k].doneEver);
  if(left.length)return `<div class="msg info">남은 사례: ${left.map(k=>`<button class="btn ghost small" onclick="pickCase(${stage},'${k}')">${CASES[k].title}</button>`).join(' ')}</div>`;
  const nt=stage===1?'s2':'s3';
  return `<div class="msg good">Stage ${stage}의 모든 사례를 해결했어요. <button class="btn mint small" onclick="go('${nt}')">Stage ${stage+1}로 이동</button></div>`;
}
function setMsg(id,k,t,c){UI.msg[id]=UI.msg[id]||{};UI.msg[id][k]=t;UI.msg[id][k+'C']=c;}
function pickItem(id,k){
  const c=CASES[id],st=S.cases[id];
  if(k===c.needItem){st.item=k;st.badItem=null;st.step='run';sfx.good();
    setMsg(id,'item',`좋아요. ${ITEMS[k].name}을(를) 골랐어요. 이제 반응을 조절해 목표 온도에 맞춰요.`,'good');}
  else{st.badItem=k;st.itemMiss++;sfx.bad();setMsg(id,'item',c.itemWrong,'bad');}
  save();renderSteps(id);
}
function setAmount(id,v){S.cases[id].amount=+v;const el=document.getElementById('amt-'+id);if(el)el.textContent=CASES[id].amt(+v);}
let RUNNING=false;
function runReaction(id){
  if(RUNNING)return;const c=CASES[id],st=S.cases[id];
  let Tf=c.T0+c.k*st.amount;if(c.minT!=null)Tf=Math.max(c.minT,Tf);Tf=Math.round(Tf*10)/10;
  RUNNING=true;const btn=$('#runBtn');if(btn)btn.disabled=true;
  setMsg(id,'run','반응이 일어나는 중… 열화상 카메라를 지켜보세요.','info');
  renderSteps(id);const b2=$('#runBtn');if(b2)b2.disabled=true;
  setTemp(c.T0);
  animateTemp(c.T0,Tf,2400,()=>{
    RUNNING=false;st.temp=Tf;st.hist.push(st.amount);
    const ok=Tf>=c.target[0]&&Tf<=c.target[1];
    if(ok){st.step='judge';sfx.good();
      setMsg(id,'run',`${c.amt(st.amount)}으로 ${Tf}°C에 도착했어요. 온도가 ${Tf<c.T0?'<span class="cold">낮아졌어요</span>':'<span class="hot">높아졌어요</span>'} (${c.T0}°C → ${Tf}°C). 이 증거로 에너지 출입을 판정해 보세요.`,'good');
      if(c.doneEmoji){$('#objE').textContent=c.doneEmoji;$('#objL').textContent='불꽃이 줄어들어요';}
    }else{st.tempMiss++;sfx.bad();
      const needMore=c.k<0?Tf>c.target[1]:Tf<c.target[0];
      const msg=Tf<c.target[0]?(c.low||c.high):c.high;
      setMsg(id,'run',`${Tf}°C가 되었어요. ${msg} 온도 변화가 ${needMore?'부족하니 양을 <span class="key">늘려</span>':'너무 크니 양을 <span class="key">줄여</span>'} 다시 해 보세요.`,'bad');
      setTimeout(()=>{if(S.cases[id].step==='run'){st.temp=c.T0;animateBack(c.T0);}},900);
    }
    save();renderSteps(id);
  });
}
function animateBack(t0){const from=TH.temp;const s=performance.now();function f(n){const p=Math.min(1,(n-s)/700);setTemp(from+(t0-from)*p);if(p<1)requestAnimationFrame(f);}requestAnimationFrame(f);}
function setJudge(id,f,v){const st=S.cases[id];if(st.step!=='judge')return;st[f]=v;delete st.bad[f];sfx.click();save();renderSteps(id);}
function submitJudge(id){
  const c=CASES[id],st=S.cases[id];
  if(!st.dir||!st.arrow||!st.kind){sfx.bad();setMsg(id,'judge','①, ②, ③을 모두 정한 뒤 제출해 주세요.','warnbox');renderSteps(id);return;}
  const want={dir:c.dir,arrow:c.dir==='exo'?'out':'in',kind:c.kind};const wrong=[];
  ['dir','arrow','kind'].forEach(f=>{if(st[f]!==want[f]){wrong.push(f);st.bad[f]=true;st.jerr[f]++;}});
  if(!wrong.length){
    st.step='done';st.attempts++;
    const sc=Math.max(2,6-(st.itemMiss+st.tempMiss+st.judgeMiss));
    if(sc>=st.best){st.best=sc;st.bestMiss={item:st.itemMiss,temp:st.tempMiss,judge:st.judgeMiss,jerr:{...st.jerr},hist:[...st.hist]};}
    const first=!st.doneEver;st.doneEver=true;S.cards[c.card]=true;
    setMsg(id,'judge',`정확해요! 계가 에너지를 ${c.dir==='exo'?'<span class="hot">방출</span>해 주변 온도가 높아졌어요':'<span class="cold">흡수</span>해 주변 온도가 낮아졌어요'}. 이 현상은 ${kindName(c.kind)}예요.`,'good');
    sfx.win();save();renderStage(c.stage);renderTabs();
    if(first){toast(`도감 카드 획득: ${CARDS.find(x=>x.id===c.card).name}`);
      if(allDone(c.stage))setTimeout(()=>toast(c.stage===1?'Stage 2가 열렸어요!':'Stage 3이 열렸어요!'),2700);}
    return;
  }
  st.judgeMiss+=wrong.length;sfx.bad();
  const up=st.temp>c.T0;const tips=[];
  if(wrong.includes('dir'))tips.push(`① 온도가 ${up?'올라갔어요':'내려갔어요'}(${c.T0}°C → ${st.temp}°C). 주변 온도가 높아지면 계가 에너지를 방출한 것이고, 낮아지면 흡수한 거예요.`);
  if(wrong.includes('arrow'))tips.push(`② 화살표는 에너지가 실제로 이동하는 방향이에요. 에너지를 내보내면 계에서 빠져나가고, 받아들이면 계로 들어와요. ①에서 고른 답과 맞는지 확인해요.`);
  if(wrong.includes('kind'))tips.push(`③ ${c.kindHint} 새로운 물질이 생기는지 따져 보세요.`);
  setMsg(id,'judge','다시 생각해 볼 부분이 있어요.<br>'+tips.join('<br>'),'bad');save();renderSteps(id);
}
function resetCase(id){
  const old=S.cases[id],c=CASES[id];const f=freshCase(id);
  f.best=old.best;f.bestMiss=old.bestMiss;f.doneEver=old.doneEver;f.attempts=old.attempts;
  S.cases[id]=f;UI.msg[id]={};save();
  if(S.tab!=='s'+c.stage){S.tab='s'+c.stage;}
  S.cur[c.stage]=id;render();toast('이 사례를 처음부터 다시 시작해요. 가장 좋은 기록은 그대로 남아요.');
}

/* ================= 드래그(터치·마우스 공통) ================= */
let PICK=null;
function bindDrag(root,onDrop){
  root.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(e.button>0)return;e.preventDefault();const sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
      const mv=ev=>{if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=el.cloneNode(true);ghost.classList.add('dragghost');ghost.style.width=el.offsetWidth+'px';document.body.appendChild(ghost);}
        if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY);const d=t&&t.closest('[data-drop]');if(over&&over!==d)over.classList.remove('over');if(d&&root.contains(d)){d.classList.add('over');over=d;}else over=null;}};
      const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
        if(over)over.classList.remove('over');
        if(ghost){ghost.remove();const t=document.elementFromPoint(ev.clientX,ev.clientY);const d=t&&t.closest('[data-drop]');if(d&&root.contains(d))onDrop(el.dataset.drag,d.dataset.drop);}
        else{ if(el.dataset.drag.startsWith('arrow:'))onDrop(el.dataset.drag,'slot');
          else{PICK=PICK===el.dataset.drag?null:el.dataset.drag;root.querySelectorAll('[data-drag]').forEach(x=>x.classList.toggle('picked',x.dataset.drag===PICK));if(PICK)toast('옮길 칸을 눌러 주세요.',1500);}}};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    });
  });
  root.querySelectorAll('[data-drop]').forEach(d=>d.addEventListener('click',ev=>{if(PICK&&!ev.target.closest('[data-drag]')){const p=PICK;PICK=null;onDrop(p,d.dataset.drop);}}));
}

       <div class="rh">화학 변화<br>(새 물질 생성)</div><div class="cell" data-drop="endo-chem">${inCell('endo-chem')}</div><div class="cell" data-drop="exo-chem">${inCell('exo-chem')}</div>

  if(tempM===0)p1+='목표 온도도 한 번에 맞춰, 반응하는 물질의 양이 많을수록 온도 변화가 커진다는 관계를 잘 예측했어요.';
  else{const worst=cs.slice().sort((a,b)=>b.m.temp-a.m.temp)[0];const h=worst.m.hist||[];
    p1+=`목표 온도를 맞추는 데 모두 ${tempM}번 다시 시도했어요${h.length>1?`(예: ${worst.c.short}에서 양을 ${h.map(a=>worst.c.amt(a)).join(' → ')}로 조절)`:''}. 결과를 보고 양을 고쳐 나간 것은 반응 물질의 양과 온도 변화의 관계를 찾아가는 좋은 탐구 과정이에요. 다음에는 처음 결과와 목표의 차이를 보고 필요한 양을 <span class="key">먼저 예측</span>한 뒤 실행해 보세요.`;}
  P.push(p1);
  const je={dir:0,arrow:0,kind:0};cs.forEach(x=>{const j=x.m.jerr||{};['dir','arrow','kind'].forEach(f=>je[f]+=j[f]||0);});
  let p2;
  if(judgeM===0)p2='에너지 출입 판정에서는 방출과 흡수, 에너지 이동 화살표, 물리 변화와 화학 변화를 모두 정확하게 판정했어요. 온도 변화를 증거로 에너지가 이동한 방향을 추론하는 능력이 뛰어나요.';
  else{const where=cs.filter(x=>x.m.judge).map(x=>x.c.short);p2=`에너지 출입 판정에서는 ${where.join(', ')} 사례에서 다시 생각한 부분이 있었어요. `;
    if(je.dir)p2+='주변 온도가 높아지면 <span class="hot">방출</span>, 낮아지면 <span class="cold">흡수</span>라는 판단 기준을 다시 떠올려 보세요. ';
    if(je.arrow)p2+='방출은 계 → 주변, 흡수는 주변 → 계로 에너지가 이동한다는 점을 화살표와 연결해 기억하면 좋아요. ';
    if(je.kind)p2+='용해나 상태 변화처럼 새로운 물질이 생기지 않으면 물리 변화, 새로운 물질이 생기면 화학 변화라는 기준을 적용해 보세요. ';
    p2+='피드백을 읽고 끝까지 판정을 바로잡은 태도가 좋았어요.';}
  P.push(p2);
  const s3=S.s3;let p3=s3.sortBestMiss===0?'자연 생태계에서는 광합성, 세포 호흡, 증발, 응결을 에너지 출입과 변화의 종류에 따라 한 번에 정확히 분류했어요. ':`자연 생태계의 현상 분류에서 ${s3.sortBestMiss}번 잘못 놓았지만 힌트를 활용해 바로잡았어요. `;
  p3+=s3.balBestTries===1?'생태계 온도도 한 번에 안정시켜, 에너지를 흡수하는 현상과 방출하는 현상의 크기를 비교하며 균형을 잘 설계했어요.':`생태계 온도는 ${s3.balBestTries}번 확인한 끝에 안정시켰어요. 흡수 합계와 방출 합계를 비교하며 균형점을 찾아간 과정이 의미 있어요.`;
  P.push(p3);
  const firstOk=S.quiz.filter(q=>q.best===6).length;const weakQ=S.quiz.map((q,i)=>q.best<6?QUIZ[i].topic:null).filter(Boolean);
  let p4=`퀴즈 5문항 중 ${firstOk}문항을 첫 시도에 맞혔어요. `+(weakQ.length?`<span class="warn">${weakQ.join(', ')}</span> 내용은 한 번 더 정리해 두세요. `:'개념을 정확하게 이해하고 있어요. ');
  ['w1','w2'].forEach((k,i)=>{const r=S.written[k].bestRes;if(!r)return;const lb=a=>a.map(x=>WRITTEN[k].crit[x].label).join(', ');p4+=`서술형 ${i+1}은 ${r.score}/15점이에요. `+(r.miss.length?`${r.hit.length?`잘 쓴 내용은 '${lb(r.hit)}'이고, `:''}보완할 내용은 <span class="warn">'${lb(r.miss)}'</span>이에요. `:'필요한 내용을 모두 담아 과학적으로 잘 설명했어요. ')+(r.mis.length?'잘못된 표현을 바로잡을 부분도 있어요. ':'');});
  P.push(p4);
  const sc=scores();let p5=`종합 점수는 ${sc.total}점으로 <span style="color:${GRADE_COL[sc.g]}">${sc.g}등급</span>이에요. `;
  if(sc.g==='A')p5+='에너지의 흡수와 방출을 실생활과 자연 현상에 적용하는 능력이 뛰어나요. 이제 주변에서 에너지 출입 현상을 찾아 친구들에게 설명해 보세요.';
  else{const [ng,th]=NEXT[sc.g];p5+=`${ng}등급까지 ${th-sc.total}점이 남았어요. 아래 '등급 올리기 안내'에 있는 부족한 과정만 골라 다시 하면 돼요.`;}
  P.push(p5);
  return P;
}

      <div><div style="font-size:24px">${esc(S.sid)} ${esc(S.name)}</div><div class="sub" style="font-size:16px">${ds}</div>
        ${S.s3.balEver?'<span class="badge">🏅 에너지 마스터 칭호</span>':''}
        <div style="margin-top:8px">${bar('시뮬레이션',sc.cs,40,'#6547D2')}${bar('퀴즈',sc.qz,30,'#1C6FCF')}${bar('서술형',sc.wr,30,'#13845C')}</div></div></div>
    <div class="c-sec"><div class="h">에너지 도감 ${Object.keys(S.cards).length}/9</div><div class="dexrow">${dex}</div></div>
    <div class="c-sec"><div class="h">사례별 수행 기록</div><table class="c-table"><tr><th>사례</th><th>에너지 출입</th><th>실수(도구/온도/판정)</th><th>점수</th></tr>${rows}</table></div>
    <div class="c-sec"><div class="h">내가 쓴 서술형 답</div>

      ${ups.length&&sc.g!=='A'?'<p class="hint" style="margin-top:8px">⭐ 표시 과정만 해결해도 다음 등급에 도달할 수 있어요.</p>':''}

/* ================= 이미지 만들기·저장(아이패드 대응) ================= */
const IMG={blob:null,url:'',name:''};
let DLP=null;
try{if(window.claude&&typeof window.claude.use==='function')DLP=window.claude.use('downloads').catch(()=>null);}catch(e){}
function getDL(){if(!DLP)return Promise.resolve(null);return Promise.race([DLP,new Promise(r=>setTimeout(()=>r(null),800))]);}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
async function makeImage(){
  const btn=$('#mkBtn');if(typeof html2canvas!=='function'){toast('이미지 도구를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.');return;}
  btn.disabled=true;btn.textContent='이미지 만드는 중…';
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const el=$('#cert');const w=el.offsetWidth,h=el.offsetHeight;
    const ios=isIOS();const maxPx=ios?12e6:32e6,maxSide=ios?8000:16000;
    let scale=Math.min(2,Math.sqrt(maxPx/(w*h)),maxSide/h,maxSide/w);scale=Math.max(.5,scale);
    const cv=await html2canvas(el,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:-window.scrollY,windowWidth:Math.max(document.documentElement.clientWidth,820)});
    if(!cv||!cv.width||!cv.height)throw new Error('empty');
    const blob=await new Promise(r=>{try{cv.toBlob(b=>r(b),'image/png');}catch(e){r(null);}});
    if(!blob||blob.size<3000)throw new Error('blank');
    const url=cv.toDataURL('image/png');if(!url||url.length<4000)throw new Error('blank');
    IMG.blob=blob;IMG.url=url;
    const d=new Date();IMG.name=`에너지마스터_${(S.sid||'')+(S.name||'결과')}_${d.getMonth()+1}월${d.getDate()}일.png`.replace(/[\\/:*?"<>|\s]/g,'');
    openModal(`<h3>결과 이미지 미리보기</h3>
      <img class="preview" src="${url}" alt="에너지 마스터 결과 이미지">
      <div class="msg info" style="display:block">${ios?`아이패드·아이폰: '이미지 저장하기'를 누르면 공유 창이 열려요. 여기서 <span class="key">'이미지 저장'</span> 또는 <span class="key">'파일에 저장'</span>을 고르세요.<br>버튼이 작동하지 않으면 위 이미지를 <span class="key">길게 눌러 '사진 앱에 저장'</span>을 고르세요.`:`'이미지 저장하기'를 누르면 PNG 파일로 내려받아요. 아이패드·아이폰에서는 공유 창에서 '이미지 저장'을 고르거나, 이미지를 길게 눌러 '사진 앱에 저장'을 고르세요.`}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class="btn ghost" onclick="closeModal()">닫기</button><button class="btn gold" onclick="saveImage()">이미지 저장하기</button></div>`);
  }catch(e){toast('이미지를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.');}
  finally{btn.disabled=false;btn.textContent='결과 이미지 만들기';}
}
async function saveImage(){
  if(!IMG.blob)return;const ios=isIOS();
  const dl=await getDL();
  if(dl){try{await dl.save({filename:IMG.name,data:IMG.blob});toast('이미지를 저장했어요.');return;}
    catch(e){const c=e&&e.code;if(c==='declined'){toast('저장을 취소했어요.');return;}if(c==='rate_limited'){toast('저장 창이 이미 열려 있어요.');return;}}}
  if(ios){try{const f=new File([IMG.blob],IMG.name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'에너지 마스터 결과'});return;}}
    catch(e){if(e&&e.name==='AbortError')return;}
    toast('미리보기 이미지를 길게 눌러 사진 앱에 저장해 주세요.',4000);return;}
  const a=document.createElement('a');const u=URL.createObjectURL(IMG.blob);a.href=u;a.download=IMG.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},4000);toast('이미지 파일을 내려받았어요.');
}

   <div class="dex">${CARDS.map(c=>S.cards[c.id]?`<div class="dcard"><div class="de">${c.emoji}</div><div class="dn">${c.name}</div><div class="dt"><span class="tag ${c.dir==='exo'?'h':'c'}">${c.dir==='exo'?'에너지 방출':'에너지 흡수'}</span><span class="tag ${c.kind==='phys'?'p':'k'}">${kindName(c.kind)}</span></div><div class="dd">${c.sub}<br>${c.desc}</div></div>`:`<div class="dcard lock">❔</div>`).join('')}</div>
